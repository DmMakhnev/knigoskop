[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knigoskop-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pydantic-settings==2.9.1", "sqlalchemy==2.0.40", "alembic==1.15.2", "psycopg[binary]==3.2.9", "celery[redis]==5.5.2", "argon2-cffi==23.1.0", "email-validator==2.2.0", "python-multipart==0.0.20", "defusedxml==0.7.1", "pypdf==6.1.1", "cryptography==46.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "fakeredis==2.29.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
known-third-party = ["alembic"]
