name: knigoskop-restored
services:
  api:
    build: ../backend
    env_file: ../.env
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    volumes:
      - files:/app/.local/files
      - mail:/app/.local/mail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ../frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-15173}:5173"]
    depends_on:
      api:
        condition: service_healthy
  worker:
    build: ../backend
    env_file: ../.env
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --beat --schedule=/tmp/celerybeat-schedule
    volumes:
      - files:/app/.local/files
      - mail:/app/.local/mail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build: ../backend
    env_file: ../.env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knigoskop}
      POSTGRES_USER: ${POSTGRES_USER:-knigoskop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  files:
  mail:
  redis_data:
